name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: vet + race tests
    runs-on: ubuntu-latest # daemon tests need a Linux PTY + /proc + bash
    strategy:
      matrix:
        go: ['1.22.x', '1.23.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race -count=1 ./...

  cross-build:
    name: cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: true
      - name: build linux/amd64 + linux/arm64
        run: make build-all
      - uses: actions/upload-artifact@v4
        with:
          name: hauntty-binaries
          path: |
            hauntty-linux-amd64
            hauntty-linux-arm64
          if-no-files-found: error
